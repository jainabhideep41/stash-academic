name: Build & Release Android APK (Native App Architecture)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Mobile Android APK (Bottom TabBar & Sheet Modals)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js (Node 22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare APK Release Binary
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Stash-Academic-v1.3.0-Mobile.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stash-Academic-v1.3.0-Mobile-APK
          path: output_apk/Stash-Academic-v1.3.0-Mobile.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release v1.3.0-mobile-ui
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0-mobile-ui
          name: "Stash Academic Mobile v1.3.0 (Native Mobile UI Redesign)"
          body: |
            ## 📱 Stash Academic Mobile v1.3.0 (Native App UI Architecture)
            
            Redesigned specifically to match the mobile UX patterns of tier-1 mobile apps (Linear, Things 3, Notion Mobile).
            
            ### 🎨 Native UI & Mobile Architecture:
            - **📱 Dedicated Mobile Top App Bar**: Fixed AMOLED black header with avatar status, title, and quick update pill.
            - **🗂️ Segmented Control Task Filters**: Instant tab switching between `Active`, `Today`, `Done`, and `All`.
            - **📑 Native Mobile Bottom Action Sheet**: Create Task and Alarm modals slide up from the bottom with iOS grabber handles.
            - **➕ Floating Action Button (FAB)**: 1-thumb touch creation floating above the bottom tab bar.
            - **📳 Micro-Haptics on Every Interaction**: Tactile feedback on checkbox toggles, tab switches, alarm actions, and button presses.
            - **🛡️ Hardware DND Bypass & Silent Mode Alarm**: Rings at full volume with mandatory anti-sleep acknowledgment.
            
            ### 📥 Download & Install:
            Download `Stash-Academic-v1.3.0-Mobile.apk` below, tap to install on your Android device.
          files: output_apk/Stash-Academic-v1.3.0-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
