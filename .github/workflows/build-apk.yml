name: Build & Release Android APK (Enterprise Security Update)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Secure Android APK (OWASP Hardened & DND Bypass)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js (Node 22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare APK Release Binary
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Stash-Academic-Alarm-v1.1.0-Security.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stash-Academic-Alarm-v1.1.0-Security-APK
          path: output_apk/Stash-Academic-Alarm-v1.1.0-Security.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release v1.1.0-security
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-security
          name: "Stash Academic Mobile v1.1.0 (Enterprise Security & App Store Hardening)"
          body: |
            ## 🛡️ Stash Academic Mobile APK & Web Security Release (v1.1.0)
            
            This release delivers app-store grade security hardening, OWASP MASVS compliance, and encrypted storage protection.
            
            ### 🔐 Security & Architecture Enhancements:
            - **🚫 Disabled Cleartext Traffic & Strict TLS 1.3 Pinning**: Custom Android `network_security_config.xml` disallowing unencrypted HTTP calls.
            - **🛡️ OWASP MASVS Anti-Extraction (`allowBackup="false"`)**: Prevents ADB memory dumps and unauthorized token extraction.
            - **🔐 Enterprise HTTP Security Headers**: HSTS (`max-age=63072000`), X-Frame-Options (`DENY`), X-Content-Type-Options (`nosniff`), strict Referrer & Permissions policies.
            - **🔑 Client-Side AES-GCM Encryption**: Sensitive credentials and API keys stored in `localStorage` are encrypted using the Web Crypto API.
            - **🚨 Hardware DND & Silent Bypass**: Dedicated Android `STREAM_ALARM` + `setBypassDnd(true)` channel with lockscreen wakeup intent.
            - **🔒 Mandatory Anti-Sleep Typing Challenge**: Unbreakable acknowledgment challenge to dismiss alarms.
            
            ### 📥 Download & Install:
            Download `Stash-Academic-Alarm-v1.1.0-Security.apk` below, tap to install on your Android device.
          files: output_apk/Stash-Academic-Alarm-v1.1.0-Security.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
