name: Build & Release Android APK (v2.0.0)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (v2.0.0)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js (Node 22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare APK Release Binary
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Stash-v2.0.0.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stash-v2.0.0-APK
          path: output_apk/Stash-v2.0.0.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "Stash v2.0.0"
          body: |
            ## 🚀 Stash v2.0.0 (Alexa Voice Assistant & Voice Alarms)
            
            ### 🎙️ Voice Assistant & Conversational Intelligence:
            - **Alexa-Style Voice Engine**: Expressive female Text-To-Speech (TTS) voice with calibrated acoustic parameters.
            - **Conversational Gemini Integration**: Seamless voice Q&A answering academic questions, reviewing upcoming tasks, and explaining complex concepts.
            - **Interactive Voice Overlay**: Pulsing voice orb, live transcript bubbles, and audio waveform animations.
            
            ### ⏰ Voice Alarms & Customizable Disarm Challenges:
            - **Alarm Acknowledgment Customizations** (Configurable in Profile Settings):
              1. **Type Confirmation Only**: Type the target phrase to disarm.
              2. **Voice Confirmation Only**: Speak into the mic ("I am awake") to verify.
              3. **Both Required (Max Urgency)**: Type phrase AND speak voice confirmation.
              4. **Neither (Standard 1-Tap)**: Instant 1-tap dismiss button.
            - **1.5+ Minute Alarm Duration**: Alarms ring for at least 90s or continuously until turned off.
            - **Alexa Voice Alarm Announcements**: Speaks custom spoken reminders when alarms trigger.
            
            ### 🔐 Authentication & UI:
            - **Native Google One-Tap Account Picker**: In-app Google Play Services sign-in without external Chrome tabs.
            - **Native Mobile UI**: Top App Bar, Segmented Controls, Bottom Action Sheets, and Floating Action Button.
            
            ### 📥 Download & Install:
            Download `Stash-v2.0.0.apk` below and tap to install on your Android device.
          files: output_apk/Stash-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
