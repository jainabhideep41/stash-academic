name: Build & Release Android APK (Native App Experience)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK (Haptics, TabBar & Back Navigation)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js (Node 22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare APK Release Binary
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Stash-Academic-v1.2.0-Native.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stash-Academic-v1.2.0-Native-APK
          path: output_apk/Stash-Academic-v1.2.0-Native.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release v1.2.0-native
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0-native
          name: "Stash Academic Mobile v1.2.0 (True Native App Experience)"
          body: |
            ## 📱 Stash Academic Mobile v1.2.0 (True Native App Experience)
            
            Eliminates all browser/website behaviors and delivers a genuine native app feel!
            
            ### 🚀 What's New in v1.2.0:
            - **📱 Native Mobile Bottom Tab Bar**: Replaces web drawers with an app-native bottom navigation bar (Dashboard, Assessment, Vault, Notes, Profile).
            - **📳 Native Micro-Haptics Engine**: Tactile vibration feedback on button presses, tab switches, alarm dismissals, and snooze.
            - **🔙 Native Android Hardware Back Button Handling**: Closes modals, navigates tabs smoothly, prevents accidental exits with double-tap exit verification, and keeps alarms ringing until solved.
            - **✨ Zero Web Rubber-Banding & Bounce**: Blocked browser pull-to-refresh, removed tap highlight flashes, and locked zoom.
            - **🕶️ Immersive Dark Status Bar & Splash Screen**: Seamless full-screen AMOLED black integration.
            - **🛡️ OWASP MASVS App Store Security**: `allowBackup="false"`, strict TLS 1.3 pinning, and AES-GCM encrypted storage.
            
            ### 📥 Download & Install:
            Download `Stash-Academic-v1.2.0-Native.apk` below, tap to install on your phone.
          files: output_apk/Stash-Academic-v1.2.0-Native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
