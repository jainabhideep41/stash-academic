name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (DND Bypass & Hardware Alarms)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js (Node 22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare APK File
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Stash-Academic-Alarm-v1.0.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stash-Academic-Alarm-v1.0-APK
          path: output_apk/Stash-Academic-Alarm-v1.0.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Stash Academic Mobile APK (Hardware Alarm & DND Bypass)"
          body: |
            ## 📱 Stash Academic Android APK (v1.0.0)
            
            ### 🚀 Features in this APK:
            - **🚨 Hardware DND & Silent Mode Bypass**: Rings via Android `STREAM_ALARM` channel at full volume even on silent switch.
            - **🔒 Mandatory Anti-Sleep Typing Challenge**: Alarm will not turn off until typing the exact acknowledgment phrase.
            - **💡 Full-Screen Lockscreen Intent**: Wakes up display and launches directly over the lockscreen.
            - **📳 Hardware Multi-Burst Vibration**: Custom vibration motor pulses.
            - **🎵 5 Custom Ringtones & Flexible Snooze**.
            
            ### 📥 Download & Install:
            Download `Stash-Academic-Alarm-v1.0.apk` below, tap to install on your Android device, and grant Notification / Exact Alarm permissions when prompted.
          files: output_apk/Stash-Academic-Alarm-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
