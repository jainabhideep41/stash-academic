name: Build & Release Android APK (Native Google One-Tap Edition)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Mobile Android APK (Native Google One-Tap & Mobile UI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js (Node 22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare APK Release Binary
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Stash-Academic-v1.4.0-GoogleNative.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stash-Academic-v1.4.0-GoogleNative-APK
          path: output_apk/Stash-Academic-v1.4.0-GoogleNative.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release v1.4.0-google-native
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0-google-native
          name: "Stash Academic Mobile v1.4.0 (Native Google One-Tap Sign-In)"
          body: |
            ## 📱 Stash Academic Mobile v1.4.0 (Native Google One-Tap Sign-In)
            
            ### 🔐 What's New:
            - **⚡ Native Google Play Services One-Tap Account Picker**: Google login now opens a native Android bottom sheet right inside the app! No more redirecting to external Google Chrome tabs.
            - **📱 Native Mobile App UI**: Dedicated top app bar, segmented control task filters, iOS/Android bottom action sheets, and floating action button (FAB).
            - **📳 Micro-Haptic Feedback**: Tactile responses on touch and toggle interactions.
            - **🛡️ Hardware DND Bypass & Silent Mode Alarm**: High-urgency academic alarms with mandatory typing verification.
            
            ### 📥 Download & Install:
            Download `Stash-Academic-v1.4.0-GoogleNative.apk` below, tap to install on your Android device.
          files: output_apk/Stash-Academic-v1.4.0-GoogleNative.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
