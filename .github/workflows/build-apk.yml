name: Build & Release Android APK (v2.1.0)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (v2.1.0)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js (Node 22 LTS for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare APK Release Binary
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Stash-v2.1.0.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stash-v2.1.0-APK
          path: output_apk/Stash-v2.1.0.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release v2.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: "Stash v2.1.0"
          body: |
            ## 🚀 Stash v2.1.0 (60+ Phone & Extreme Alarm Sounds Library + Multi-Voice Personas)
            
            ### 🔊 60+ Authentic Alarm Sounds Library:
            - **📱 Samsung & Xiaomi Classics (12 Sounds)**: Samsung Horizon, Samsung Homecoming, Xiaomi Fireflies, Xiaomi Morning Glory, Xiaomi Sweet Dream, Apple Radar, Apple Apex, Apple Wind Chimes, Pixel Zen Dawn, Samsung Cosmos, Xiaomi Mountain Breeze, Pixel Voyager.
            - **🚨 Extreme Sirens & Wake-Up (12 Sounds)**: Nuclear Meltdown Siren, Industrial Air Horn, Submarine Klaxon, Fire Evacuation Alarm, DEFCON 1 Hazard, Emergency Police Interceptor, 120Hz Buzzer, Ultrasonic Screamer, Shockwave Strobe, Ambulance Yelp, Tornado Horn, Drill Sergeant Staccato.
            - **📟 Digital Clocks & Electronic (12 Sounds)**: Classic 4-Burst Beep, High-Speed Clock Ticker, 80s Vintage Casio, 8-Bit Retro Jump, Cyberpunk Glitch, Matrix Data Stream, Deep Sea Sonar, 90s Telecom Bell, Pulsar Beacon, Techno Beat Drop, Synthwave Lead, Arcade Extra Life.
            - **🎹 Melodic, Marimba & Orchestral (12 Sounds)**: Sunny Marimba Groove, African Kalimba, Jazz Vibraphone, Grand Piano Arpeggio, Glockenspiel, Celesta Fairytale, Angelic Harp, Westminster Big Ben Chimes, Cathedral Bells, Steel Drum, Xylophone, Royal Fanfare.
            - **🧘 Zen, Nature & Singing Bowls (12 Sounds)**: Tibetan Singing Bowl, Temple Bronze Gong, Zen Bamboo Flute, Raindrops, Morning Songbirds, Deep Ocean Swell, Kyoto Water Rocker, Summer Meadow, Highland Whistle, Ting-Sha Cymbal, Monastery Dawn, Aeolian Wind Harp.
            
            ### 🎙️ Multi-Voice Persona Suite:
            - Amazon Alexa (US English)
            - Alexa British (UK English)
            - Alexa Aussie (Australian English)
            - Calm Morning Wake-Up
            - Drill Sergeant Alarm Commander
            
            ### 📥 Download & Install:
            Download `Stash-v2.1.0.apk` below and tap to install on your Android device.
          files: output_apk/Stash-v2.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
